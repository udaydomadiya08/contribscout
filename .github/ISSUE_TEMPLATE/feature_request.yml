name: Feature Request
description: Suggest an idea or enhancement for ContribScout
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome ideas for improving ContribScout discovery heuristics, scoring algorithms, and developer experience!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions or workarounds
      description: Any alternative options or features you've considered.
    validations:
      required: false
